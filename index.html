<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrakForce</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{
  --bg:#111315; --panel:#1C1F23; --panel2:#24282D; --line:#33383F;
  --text:#F4F5F6; --muted:#A3AAB2; --accent:#FFD21F; --accent-ink:#111315;
  --left:#3FA7FF; --right:#FFD21F; --ok:#3DDC84; --warn:#FF8A3D; --bad:#FF5A5A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.brand,.big{font-family:"Space Grotesk",system-ui,sans-serif}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 8px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header.top{position:sticky;top:0;z-index:5;background:rgba(17,19,21,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.5px;background:none;border:0;color:var(--text);padding:0;min-height:44px}
.brand .f{color:var(--accent)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 14px;min-height:44px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--warn)}
.dot.on{background:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600}
.btn:hover{border-color:#4A5059}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent}
.btn.big{min-height:60px;font-size:18px;padding:12px 28px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--text);min-height:56px}
.item:hover{border-color:var(--accent)}
.item .sub{color:var(--muted);font-size:14px}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);flex:none}
.muted{color:var(--muted)}
.small{font-size:14px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{margin-bottom:14px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600;padding:10px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.side-l[aria-pressed="true"]{background:var(--left)!important;border-color:var(--left)!important;color:#0B1620!important}
.metric{background:var(--panel2);border-radius:12px;padding:12px}
.metric .v{font-family:"Space Grotesk",sans-serif;font-size:26px;font-weight:700}
.metric .k{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.chip.L{color:var(--left);border-color:var(--left)}
.chip.R{color:var(--right);border-color:var(--right)}
.chip.B{color:var(--text)}
.asym{display:flex;align-items:center;gap:14px}
.light{width:18px;height:18px;border-radius:50%}
.big{font-size:72px;font-weight:700;line-height:1}
.status{font-family:"Space Grotesk",sans-serif;font-size:22px;font-weight:700;min-height:32px}
canvas{width:100%;display:block;background:var(--panel2);border-radius:12px}
.back{background:none;border:0;color:var(--muted);padding:8px 0;min-height:44px;font-weight:600}
.body-wrap{display:grid;grid-template-columns:minmax(200px,280px) 1fr;gap:20px;align-items:start}
@media (max-width:640px){.body-wrap{grid-template-columns:1fr}.big{font-size:56px}}
svg .zone{fill:#3A3F46;stroke:#111315;stroke-width:2;cursor:pointer;transition:fill .15s}
svg .zone:hover,svg .zone.sel,svg .zone:focus{fill:var(--accent);outline:none}
svg .deco{fill:#2A2E34}
.zbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.zbtns button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600}
.zbtns button:hover{border-color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.note{background:#2A2117;border:1px solid #5A3A1D;color:#FFD9BF;border-radius:12px;padding:12px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:currentColor}
.legend .lL{color:var(--left)}.legend .lR{color:var(--right)}.legend .lT{color:var(--text)}
@media print{
  header.top,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card,.metric{background:#fff;border-color:#ccc;color:#000}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" data-action="home" aria-label="Ir a pacientes">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#FFD21F"/><g transform="translate(9 3) scale(.183)"><path d="M60 4 50 18h20Z" fill="#111315"/><rect x="56" y="16" width="8" height="14" fill="#111315"/><rect x="24" y="30" width="72" height="100" rx="8" fill="#111315"/><rect x="24" y="61" width="44" height="10" fill="#FFD21F"/><circle cx="68" cy="66" r="9" fill="#FFD21F"/><rect x="52" y="89" width="44" height="10" fill="#FFD21F"/><circle cx="52" cy="94" r="9" fill="#FFD21F"/><rect x="56" y="130" width="8" height="14" fill="#111315"/><path d="M60 156 50 142h20Z" fill="#111315"/></g></svg>
      <span>Trak<span class="f">Force</span> <small style="font-size:11px;color:#A3AAB2;font-weight:500">v6</small></span>
    </button>
    <div class="spacer"></div>
    <button class="pill" data-action="sensor" id="sensorPill"><span class="dot" id="sensorDot"></span><span id="sensorTxt">Simulado</span></button>
    <button class="pill" data-action="settings" aria-label="Ajustes">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="modalRoot"></div>

<script>
/* ============================================================
   TrakForce — prototipo
   Datos: localStorage del navegador (este dispositivo).
   Sensor: modo simulado o Bluetooth LE (ESP32 + HX711).
   Protocolo BLE previsto (firmware lo implementa después):
     Servicio  6e400001-b5a3-f393-e0a9-e50e24dcca9e (estilo Nordic UART)
     Notify    6e400003-...  -> paquetes de float32 little-endian, fuerza en N, 80 Hz
     Write     6e400002-...  -> 'T' = tara en el equipo
   ============================================================ */

const HZ = 80;
const G = 9.80665;
const BLE_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const BLE_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const BLE_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

const ZONES = {
  cuello:{name:'Cuello', base:150, ex:['Flexión cervical','Extensión cervical','Flexión lateral cervical']},
  hombro:{name:'Hombro', base:200, ex:['Rotación externa 0°','Rotación externa 90°','Rotación interna 90°','Abducción (Y)','Press isométrico']},
  codo:{name:'Codo', base:220, ex:['Flexión de codo 90°','Extensión de codo 90°']},
  tronco:{name:'Tronco', base:600, ex:['Extensión lumbar','Flexión de tronco']},
  cadera:{name:'Cadera', base:380, ex:['Aductores (squeeze)','Abductores','Extensores de cadera','Flexores de cadera']},
  rodilla:{name:'Rodilla', base:400, ex:['Isquios 30°','Isquios 90°','Cuádriceps 60°','Cuádriceps 90°','Nordic isométrico']},
  tobillo:{name:'Tobillo', base:900, ex:['Flexión plantar (sóleo)','Dorsiflexión']},
  global:{name:'Global', base:1400, ex:['IMTP unilateral','IMTP bilateral','Empuje de scrum']}
};
const SIDE_NAME = {L:'Izquierdo', R:'Derecho', B:'Bilateral'};
const MODES = {
  tiempo:{name:'Tiempo fijo', desc:'Contracción de X segundos. Pico, RFD e impulso.'},
  fallo:{name:'Al fallo', desc:'Sostiene hasta que la fuerza cae bajo un % del pico.'},
  reps:{name:'Repeticiones', desc:'Varios intentos con descanso. Guarda el mejor.'},
  objetivo:{name:'Objetivo', desc:'Mantener un % del máximo con línea guía (biofeedback).'}
};

/* ---------------- almacenamiento ---------------- */
const KEY = 'trakforce.v1';
let DB = {patients:[], evals:[], settings:{unit:'N', asymGreen:10, asymRed:15, countdown:3, customEx:{}}};
function load(){ try{ const s = localStorage.getItem(KEY); if(s){ const d = JSON.parse(s); DB = Object.assign(DB, d); DB.settings = Object.assign({unit:'N',asymGreen:10,asymRed:15,countdown:3,customEx:{}}, d.settings||{}); } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast('No se pudo guardar en este navegador.'); } }
load();

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unitLbl = () => DB.settings.unit === 'kgf' ? 'kgf' : 'N';
const fF = (n, d) => n == null || isNaN(n) ? '—' : (DB.settings.unit === 'kgf' ? n / G : n).toFixed(d ?? (DB.settings.unit === 'kgf' ? 1 : 0));
const fDate = iso => new Date(iso).toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric'});
const fDT = iso => new Date(iso).toLocaleString('es-AR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
const sameDay = (a,b) => new Date(a).toDateString() === new Date(b).toDateString();
const exercisesOf = z => [...ZONES[z].ex, ...((DB.settings.customEx||{})[z]||[])];
const zoneOfEx = ex => Object.keys(ZONES).find(z => exercisesOf(z).includes(ex)) || 'global';
function toast(msg){ const t = document.createElement('div'); t.textContent = msg; t.setAttribute('role','status'); t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#24282D;border:1px solid #33383F;color:#F4F5F6;padding:12px 18px;border-radius:12px;z-index:30;max-width:90vw'; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function asymColor(p){ const s = DB.settings; return p < s.asymGreen ? 'var(--ok)' : p <= s.asymRed ? 'var(--warn)' : 'var(--bad)'; }
function asymText(p){ const s = DB.settings; return p < s.asymGreen ? 'Normal' : p <= s.asymRed ? 'Atención' : 'Asimetría alta'; }

/* ---------------- audio ---------------- */
let actx = null;
function beep(freq=880, ms=120){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = freq; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.2, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + ms/1000); o.start(); o.stop(actx.currentTime + ms/1000); }catch(e){} }

/* ---------------- sensor ---------------- */
const Sensor = {
  kind:'sim', connected:false, offset:0, last:[], rate:HZ, _cnt:0, _t0:0, listeners:new Set(), timer:null, dev:null, rx:null, tx:null, gen:0,
  effort:null, effortT0:0,
  resetRate(){ this._cnt=0; this._t0=0; this.rate=this.kind==='sim'?HZ:0; this.last=[]; },
  emit(raw){ const now=performance.now(); if(!this._t0) this._t0=now; this._cnt++; if(now-this._t0>=1000){ this.rate=this._cnt*1000/(now-this._t0); this._cnt=0; this._t0=now; } this.last.push(raw); if(this.last.length > HZ*6) this.last.shift(); const v = raw - this.offset; this.listeners.forEach(fn => fn(v)); },
  tare(){ if(this.kind==='ble'){ this.offset = 0; if(this.rx){ try{ this.rx.writeValue(new TextEncoder().encode('T')); }catch(e){} } return; } const n = Math.min(this.last.length, Math.max(1,Math.round(curHz()/2))); if(!n) return; const arr = this.last.slice(-n); this.offset = arr.reduce((a,b)=>a+b,0)/n; },
  startSim(){ this.stopAll(); this.kind='sim'; this.connected=true; this.offset = 0; this.resetRate(); const base = 12; let t = 0; const my = ++this.gen;
    this.timer = setInterval(()=>{ if(this.kind!=='sim' || this.gen!==my) return; t += 1/HZ; let f = base + (Math.random()-.5)*3;
      if(this.effort){ const e = this.effort, te = (performance.now()-this.effortT0)/1000; f += simForce(e, te) * (e.dir==='E' ? -1 : 1); }
      this.emit(f); }, 1000/HZ); updatePill(); },
  setEffort(profile){ this.effort = profile; this.effortT0 = performance.now(); },
  async connectBLE(){
    if(!navigator.bluetooth){ openModal(`<h2>Bluetooth no disponible acá</h2><p>Este navegador no permite Bluetooth. En iPhone o iPad abrí TrakForce desde <b>Bluefy</b> (gratis en la App Store) con la versión publicada en GitHub Pages. En Android o en la compu funciona con Chrome.</p><p class="muted small">Mientras tanto podés seguir en modo simulado.</p><div class="row"><button class="btn primary" data-action="closeModal">Entendido</button></div>`); return; }
    try{
      const dev = await navigator.bluetooth.requestDevice({filters:[{namePrefix:'TrakForce'}], optionalServices:[BLE_SERVICE]});
      this.stopAll();
      const my = ++this.gen;
      const srv = await (await dev.gatt.connect()).getPrimaryService(BLE_SERVICE);
      const tx = await srv.getCharacteristic(BLE_TX);
      try{ this.rx = await srv.getCharacteristic(BLE_RX); }catch(e){ this.rx = null; }
      if(this.gen!==my) return;
      this.kind='ble'; this.dev = dev; this.tx = tx; this.connected = true; this.offset = 0; this.resetRate();
      tx.oncharacteristicvaluechanged = ev => { if(this.gen!==my) return; const dv = ev.target.value; for(let i=0;i+4<=dv.byteLength;i+=4) this.emit(dv.getFloat32(i, true)); };
      await tx.startNotifications();
      dev.ongattserverdisconnected = () => { if(this.gen!==my) return; this.kind='off'; this.connected=false; this.dev=null; updatePill(); toast('Sensor desconectado. Volvé a conectarlo.'); };
      updatePill(); toast('Sensor conectado');
    }catch(e){ if(e && e.name !== 'NotFoundError') toast('No se pudo conectar: ' + (e.message||e)); updatePill(); }
  },
  stopAll(){ this.gen++; clearInterval(this.timer); this.timer = null; if(this.tx){ this.tx.oncharacteristicvaluechanged = null; this.tx = null; } if(this.dev){ this.dev.ongattserverdisconnected = null; if(this.dev.gatt && this.dev.gatt.connected){ try{ this.dev.gatt.disconnect(); }catch(e){} } } this.dev = null; this.connected = false; this.kind='off'; }
};
function curHz(){ return Sensor.kind==='sim' ? HZ : Math.max(1, Math.round(Sensor.rate||11)); }
function simForce(e, t){
  // e: {peak, mode, hold, decay, target, dur}
  const d = .25; if(t < d) return 0;
  const tt = t - d; let f;
  if(e.mode === 'objetivo'){ const tgt = e.target * (1 + .04*Math.sin(tt*2.1) + .02*Math.sin(tt*5.3)); f = tgt * (1 - Math.exp(-tt/.35)); }
  else { f = e.peak * (1 - Math.exp(-tt/.16)); if(e.mode === 'fallo' && tt > e.hold) f *= Math.exp(-(tt-e.hold)/e.decay); else if(tt > .8) f *= 1 - .04*Math.min(1,(tt-.8)/4); }
  if(e.endAt && t > e.endAt) f *= Math.exp(-(t-e.endAt)/.09);
  return f * (1 + (Math.random()-.5)*.02);
}
function updatePill(){ const d=$('#sensorDot'); d.classList.toggle('on', Sensor.kind==='ble'); d.style.background = Sensor.kind==='off' ? 'var(--bad)' : ''; $('#sensorTxt').textContent = Sensor.kind==='ble' ? 'Sensor conectado' : Sensor.kind==='sim' ? 'Simulado' : 'Sin sensor'; }

/* ---------------- métricas ---------------- */
function metrics(s, hz=HZ, opts={}){
  const n = s.length; if(!n) return {};
  let peak = -Infinity, ip = 0; s.forEach((v,i)=>{ if(v>peak){peak=v; ip=i;} });
  const thr = Math.max(5, .05*peak);
  let on = s.findIndex(v => v > thr); if(on < 0) on = 0;
  let end = n-1; for(let i=n-1;i>=ip;i--){ if(s[i] > .1*peak){ end = i; break; } }
  const at = ms => s[Math.min(n-1, on + Math.round(ms/1000*hz))];
  const base = s[on];
  const rfd100 = (at(100) - base) / .1, rfd200 = (at(200) - base) / .2;
  let sum = 0, cnt = 0; for(let i=on;i<=end;i++){ sum += s[i]; cnt++; }
  const mean = cnt ? sum/cnt : 0, impulse = sum / hz;
  const tPeak = (ip - on) / hz;
  const failPct = (opts.failPct || 50)/100;
  let tFail = null; for(let i=ip;i<n;i++){ if(s[i] < failPct*peak){ tFail = (i - on)/hz; break; } }
  let rel = n-1; for(let i=n-1;i>=ip;i--){ if(s[i] >= .5*peak){ rel = i; break; } } const last1 = s.slice(Math.max(on, rel - hz), Math.max(on+1, rel - Math.round(.2*hz))); const lastMean = last1.reduce((a,b)=>a+b,0)/(last1.length||1);
  const drop = peak > 0 ? Math.max(0, (peak - lastMean)/peak*100) : 0;
  let inBand = null; if(opts.target){ let k=0,c=0; for(let i=on;i<=end;i++){ c++; if(Math.abs(s[i]-opts.target) <= .05*opts.target) k++; } inBand = c ? k/c*100 : 0; }
  return {peak, mean, rfd100, rfd200, impulse, tPeak, tFail, drop, inBand, dur:(end-on)/hz};
}

/* ---------------- gráficos ---------------- */
function setupCanvas(c, h){ const dpr = window.devicePixelRatio||1; const w = c.clientWidth || 600; c.width = w*dpr; c.height = h*dpr; c.style.height = h+'px'; const x = c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); return {x, w, h}; }
function drawCurves(c, series, o={}){
  const {x, w, h} = setupCanvas(c, o.h || 260);
  const pl = 52, pr = 12, pt = 14, pb = 30, W = w-pl-pr, H = h-pt-pb;
  const k = DB.settings.unit === 'kgf' ? 1/G : 1;
  const hzOf = s => s.hz || o.hz || HZ;
  let tmax = o.tmax || Math.max(1, ...series.map(s => s.data.length/hzOf(s)));
  let ymax = Math.max(o.ymin||50, ...series.flatMap(s => s.data.map(v=>v*k)), (o.target||0)*k*1.15) * 1.1;
  const X = t => pl + t/tmax*W, Y = v => pt + H - (v/ymax)*H;
  x.font = '12px system-ui'; x.fillStyle = '#A3AAB2'; x.strokeStyle = '#33383F'; x.lineWidth = 1;
  const ystep = niceStep(ymax/4); for(let v=0; v<=ymax; v+=ystep){ x.beginPath(); x.moveTo(pl, Y(v)); x.lineTo(w-pr, Y(v)); x.stroke(); x.fillText(v.toFixed(0), 6, Y(v)+4); }
  const tstep = niceStep(tmax/6); for(let t=0; t<=tmax+1e-6; t+=tstep){ x.fillText(t.toFixed(tstep<1?1:0)+' s', X(t)-10, h-8); }
  x.fillText(unitLbl(), 6, 12);
  if(o.target){ const tv = o.target*k; x.fillStyle = 'rgba(244,245,246,.10)'; x.fillRect(pl, Y(tv*1.05), W, Y(tv*.95)-Y(tv*1.05)); x.strokeStyle = "#F4F5F6"; x.setLineDash([6,4]); x.beginPath(); x.moveTo(pl,Y(tv)); x.lineTo(w-pr,Y(tv)); x.stroke(); x.setLineDash([]); }
  series.forEach(s => { x.strokeStyle = s.color; x.lineWidth = s.width || 2.5; x.globalAlpha = s.alpha || 1; x.beginPath(); const sh = hzOf(s); s.data.forEach((v,i)=>{ const px = X(i/sh), py = Y(Math.max(0,v*k)); i ? x.lineTo(px,py) : x.moveTo(px,py); }); x.stroke(); x.globalAlpha = 1; });
}
function niceStep(r){ const p = Math.pow(10, Math.floor(Math.log10(r||1))); const m = r/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; }
function drawEvolution(c, pts){
  const {x, w, h} = setupCanvas(c, 240);
  const pl = 52, pr = 12, pt = 14, pb = 30, W = w-pl-pr, H = h-pt-pb;
  if(!pts.length){ x.fillStyle='#A3AAB2'; x.font='14px system-ui'; x.fillText('Sin datos para este ejercicio', pl, h/2); return; }
  const k = DB.settings.unit === 'kgf' ? 1/G : 1;
  const ts = pts.map(p=>+new Date(p.date)); let t0 = Math.min(...ts), t1 = Math.max(...ts); if(t1===t0){ t0 -= 864e5; t1 += 864e5; }
  const ymax = Math.max(...pts.map(p=>p.peak*k))*1.15;
  const X = t => pl + (t-t0)/(t1-t0)*W, Y = v => pt + H - v/ymax*H;
  x.font='12px system-ui'; x.fillStyle='#A3AAB2'; x.strokeStyle='#33383F';
  const st = niceStep(ymax/4); for(let v=0; v<=ymax; v+=st){ x.beginPath(); x.moveTo(pl,Y(v)); x.lineTo(w-pr,Y(v)); x.stroke(); x.fillText(v.toFixed(0), 6, Y(v)+4); }
  x.fillText(fDate(new Date(t0).toISOString()), pl, h-8); const lbl = fDate(new Date(t1).toISOString()); x.fillText(lbl, w-pr-x.measureText(lbl).width, h-8);
  [['L','#3FA7FF'],['R','#FFD21F'],['B','#F4F5F6']].forEach(([sd,col]) => { const ps = pts.filter(p=>p.side===sd).sort((a,b)=>new Date(a.date)-new Date(b.date)); if(!ps.length) return; x.strokeStyle = col; x.fillStyle = col; x.lineWidth = 2.5; x.beginPath(); ps.forEach((p,i)=>{ const px=X(+new Date(p.date)), py=Y(p.peak*k); i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke(); ps.forEach(p=>{ x.beginPath(); x.arc(X(+new Date(p.date)), Y(p.peak*k), 4.5, 0, 7); x.fill(); }); });
}

  </div>
  <h2>Historial</h2>
  <div class="list">${ev.map(e=>`<button class="item" data-action="openEval" data-id="${e.id}"><span class="chip ${e.side}">${SIDE_NAME[e.side]}</span><span style="flex:1"><b>${esc(e.exercise)}</b><br><span class="sub">${fDT(e.date)} · ${MODES[e.mode].name} · ${e.dir==='E'?'Empuje':'Tracción'}</span></span><span style="text-align:right"><b>${fF(e.metrics.peak)} ${unitLbl()}</b><br><span class="sub">${p.weight?(e.metrics.peak/p.weight).toFixed(1)+' N/kg':''}</span></span></button>`).join('')}</div>`
  : `<div class="empty card">Sin evaluaciones todavía. Tocá <b>Nueva evaluación</b> para empezar.</div>`}`;
};
function asymPairs(evs){
  const byDay = {}; evs.forEach(e=>{ if(e.side==='B') return; const d = new Date(e.date).toDateString(); byDay[d] = byDay[d]||{date:e.date}; const cur = byDay[d][e.side]; if(cur==null || e.metrics.peak > cur) byDay[d][e.side] = e.metrics.peak; });
  return Object.values(byDay).filter(r=>r.L!=null && r.R!=null).map(r=>{ const mx = Math.max(r.L,r.R), mn = Math.min(r.L,r.R); return Object.assign(r, {a:(mx-mn)/mx*100, weak: r.L<r.R?'Izq. más débil':'Der. más débil'}); }).sort((a,b)=>new Date(b.date)-new Date(a.date));
}

/* ----- evaluación: configuración ----- */
VIEWS.evalConfig = () => {
  const p = patient(flow.pid);
  const isGlobal = flow.zone === 'global';
  flow.side = flow.side || (isGlobal && /bilateral|scrum/i.test(flow.exercise) ? 'B' : null);
  flow.mode = flow.mode || 'tiempo';
  flow.dir = flow.dir || defaultDir(flow.exercise);
  flow.params = Object.assign({dur:5, failPct:50, maxDur:60, reps:3, rest:60, pct:70, ref:null, keep:'mejor'}, flow.params||{});
  const best = bestPeak(p.id, flow.exercise, flow.side);
  const P = flow.params;
  const done = todaySides(p.id, flow.exercise);
  const modeFields = {
    tiempo:`<div class="field"><label for="p-dur">Duración (s)</label><input id="p-dur" data-p="dur" type="number" min="1" max="60" value="${P.dur}"></div>`,
    fallo:`<div class="grid g2"><div class="field"><label for="p-fail">Corta cuando la fuerza cae bajo (% del pico)</label><input id="p-fail" data-p="failPct" type="number" min="10" max="95" value="${P.failPct}"></div><div class="field"><label for="p-max">Tiempo máximo (s)</label><input id="p-max" data-p="maxDur" type="number" min="5" max="300" value="${P.maxDur}"></div></div>`,
    reps:`<div class="grid g2"><div class="field"><label for="p-reps">Intentos</label><input id="p-reps" data-p="reps" type="number" min="2" max="10" value="${P.reps}"></div><div class="field"><label for="p-dur">Duración de cada intento (s)</label><input id="p-dur" data-p="dur" type="number" min="1" max="60" value="${P.dur}"></div><div class="field"><label for="p-rest">Descanso (s)</label><input id="p-rest" data-p="rest" type="number" min="5" max="600" value="${P.rest}"></div><div class="field"><label for="p-keep">Guardar</label><select id="p-keep" data-p="keep"><option value="mejor" ${P.keep==='mejor'?'selected':''}>Mejor intento</option><option value="promedio" ${P.keep==='promedio'?'selected':''}>Promedio de intentos</option></select></div></div>`,
    objetivo:`<div class="grid g2"><div class="field"><label for="p-pct">Objetivo (% del máximo)</label><input id="p-pct" data-p="pct" type="number" min="10" max="100" value="${P.pct}"></div><div class="field"><label for="p-ref">Máximo de referencia (${unitLbl()})</label><input id="p-ref" data-p="ref" type="number" placeholder="${best?fF(best):'Ingresá un valor'}" value="${P.ref!=null?fF(P.ref):''}"></div><div class="field"><label for="p-dur">Duración (s)</label><input id="p-dur" data-p="dur" type="number" min="3" max="120" value="${P.dur}"></div></div><p class="muted small">${best?`Si lo dejás vacío uso el mejor pico registrado de este lado: ${fF(best)} ${unitLbl()}.`:'No hay un pico previo de este ejercicio y lado: cargá un máximo de referencia.'}</p>`
  };
  afterRenderHooks.push(()=> document.querySelectorAll('[data-p]').forEach(inp => inp.addEventListener('change', e => { const k = e.target.dataset.p; let v = e.target.value; if(k==='keep'){ P[k]=v; return; } v = parseFloat(v); if(k==='ref'){ P.ref = isNaN(v)?null:(DB.settings.unit==='kgf'?v*G:v); } else if(!isNaN(v)) P[k]=v; })));
  return `
  <button class="back" data-action="backEj">← Ejercicios</button>
  <h1>${esc(flow.exercise)}</h1><p class="muted">${esc(p.name)} · ${ZONES[flow.zone].name}</p>
  <div class="card" style="margin-bottom:12px"><h3>Lado</h3>
    <div class="seg" role="group" aria-label="Lado">
      <button class="side-l" aria-pressed="${flow.side==='L'}" data-action="side" data-side="L">Izquierdo${done.L?' ✓':''}</button>
      <button aria-pressed="${flow.side==='R'}" data-action="side" data-side="R">Derecho${done.R?' ✓':''}</button>
      ${isGlobal?`<button aria-pressed="${flow.side==='B'}" data-action="side" data-side="B">Bilateral</button>`:''}
    </div>
    ${done.L||done.R?`<p class="muted small" style="margin:10px 0 0">✓ = ya evaluado hoy.</p>`:''}
  </div>
  <div class="card" style="margin-bottom:12px"><h3>Sentido de la fuerza</h3>
    <div class="seg" role="group" aria-label="Sentido"><button aria-pressed="${flow.dir==='T'}" data-action="dir" data-dir="T">Tracción (tirar)</button><button aria-pressed="${flow.dir==='E'}" data-action="dir" data-dir="E">Empuje (compresión)</button></div>
    <p class="muted small" style="margin:10px 0 0">${flow.dir==='E'?'Montá la celda con placas de apoyo, no con cadenas.':'Celda colgada con argollas o cadenas.'}</p>
  </div>
  <div class="card" style="margin-bottom:12px"><h3>Modo</h3>
    <div class="seg" role="group" aria-label="Modo">${Object.keys(MODES).map(m=>`<button aria-pressed="${flow.mode===m}" data-action="mode" data-mode="${m}">${MODES[m].name}</button>`).join('')}</div>
    <p class="muted small" style="margin:10px 0 14px">${MODES[flow.mode].desc}</p>
    ${modeFields[flow.mode]}
  </div>
  <button class="btn primary big" data-action="toTest" ${flow.side?'':'disabled'} style="width:100%">${flow.side?'Ir a evaluar':'Elegí el lado para continuar'}</button>`;
};
function defaultDir(ex){ const d = (DB.settings.exDir||{})[ex]; if(d) return d; return /scrum|press|extensión de codo|empuje/i.test(ex||'') ? 'E' : 'T'; }
function bestPeak(pid, ex, side){ const ps = DB.evals.filter(e=>e.patientId===pid && e.exercise===ex && (!side || e.side===side)).map(e=>e.metrics.peak); return ps.length ? Math.max(...ps) : null; }
function todaySides(pid, ex){ const r = {}; DB.evals.forEach(e=>{ if(e.patientId===pid && e.exercise===ex && sameDay(e.date, new Date())) r[e.side]=true; }); return r; }

/* ----- evaluación: test en vivo ----- */
let live = null;
function stopLive(){ if(live){ live.stopped = true; Sensor.listeners.delete(live.listener); cancelAnimationFrame(live.raf); clearTimeout(live.timeout); clearInterval(live.restTimer); Sensor.setEffort(null); live = null; } }
VIEWS.evalTest = () => {
  const p = patient(flow.pid), P = flow.params;
  const target = flow.mode==='objetivo' ? (P.ref || bestPeak(p.id, flow.exercise, flow.side) || 300) * P.pct/100 : null;
  afterRenderHooks.push(()=> startLive(target));
  return `
  <button class="back" data-action="cancelTest">← Configuración</button>
  <div class="row" style="margin-bottom:8px"><h1 style="margin:0">${esc(flow.exercise)}</h1><span class="chip ${flow.side}">${SIDE_NAME[flow.side]}</span></div>
  <p class="muted" style="margin-top:0">${esc(p.name)} · ${flow.dir==='E'?'Empuje':'Tracción'} · ${MODES[flow.mode].name}${flow.mode==='tiempo'||flow.mode==='reps'||flow.mode==='objetivo'?' · '+P.dur+' s':''}${flow.mode==='reps'?' · '+P.reps+' intentos':''}${target?' · objetivo '+fF(target)+' '+unitLbl():''}</p>
  <div class="card">
    <div class="row" style="align-items:flex-end"><div><div class="big" id="liveVal" aria-live="off">0</div><div class="muted">${unitLbl()} · pico <b id="livePeak">—</b></div></div><div class="spacer"></div><div class="status" id="liveStatus" aria-live="polite">Listo</div></div>
    <canvas id="liveC" style="margin-top:12px" role="img" aria-label="Curva de fuerza en vivo"></canvas>
    ${target?`<div class="legend" style="margin-top:8px"><span class="lR">Fuerza</span><span class="lT">Objetivo ±5 %</span></div>`:''}
    <div class="row noprint" style="margin-top:14px">
      <button class="btn" data-action="tare" id="bTare">Tara (poner en cero)</button>
      <div class="spacer"></div>
      <button class="btn" data-action="skipRest" id="bSkip" hidden>Saltar descanso</button>
      <button class="btn danger" data-action="stopTest" id="bStop" hidden>Detener</button>
      <button class="btn primary big" data-action="startTest" id="bStart">Iniciar</button>
    </div>
    <div class="note" id="dirWarn" hidden style="margin-top:10px">La fuerza llega en negativo: ¿elegiste el sentido correcto? Volvé a Configuración y cambiá entre Tracción y Empuje.</div>
    <p class="muted small" style="margin:10px 0 0">Antes de cada intento: sin carga, tocá Tara.</p>${Sensor.kind!=='ble'?'<div class="note" style="margin-top:10px"><b>'+(Sensor.kind==='sim'?'Modo simulado: la curva es de ejemplo, no de la celda.':'Sin sensor conectado.')+'</b> Tocá la pastilla de arriba para conectar TrakForce.</div>':''}
  </div>`;
};
function startLive(target){
  const c = $('#liveC');
  live = {buf:[], raw:[], base:0, rec:null, attempts:[], target, peak:0, phase:'idle', stopped:false};
  const sgn = flow.dir==='E' ? -1 : 1;
  live.listener = v0 => { live.raw.push(v0*sgn); if(live.raw.length > curHz()*3) live.raw.shift(); const v = v0*sgn - live.base; live.buf.push(v); if(live.buf.length > curHz()*5) live.buf.shift(); if(live.rec){ live.rec.push(v); } };
  Sensor.listeners.add(live.listener);
  const tick = () => { if(!live || live.stopped) return;
    const cur = live.buf.length ? live.buf.slice(-4).reduce((a,b)=>a+b,0)/Math.min(4,live.buf.length) : 0;
    $('#liveVal').textContent = fF(cur);
    const w = $('#dirWarn'); if(w) w.hidden = !(cur < -15);
    if(live.rec){ const pk = Math.max(0,...live.rec); $('#livePeak').textContent = fF(pk)+' '+unitLbl(); }
    const data = live.rec || live.buf;
    const tmax = live.rec ? Math.max(live.tmax||5, data.length/curHz()) : 5;
    drawCurves(c, [{data, color:'#FFD21F'}], {tmax, target:live.target, h:280, hz:curHz()});
    live.raf = requestAnimationFrame(tick); };
  tick();
}
function autoZero(){ if(!live) return; const n=Math.min(live.raw.length, Math.max(3,Math.round(curHz()*0.6))); if(!n) return; const a=live.raw.slice(-n); live.base=a.reduce((x,y)=>x+y,0)/n; live.buf=[]; }
function setStatus(t){ const s = $('#liveStatus'); if(s) s.textContent = t; }
async function countdown(){ const n = DB.settings.countdown|0; for(let i=n;i>0;i--){ if(!live||live.stopped) return false; setStatus(i+'…'); beep(660,100); await wait(1000); } if(!live||live.stopped) return false; setStatus('¡Fuerza!'); beep(1046,250); return true; }
const wait = ms => new Promise(r => { if(live) live.timeout = setTimeout(r, ms); else r(); });
async function runTest(){
  if(!live || live.running) return; live.running = true;
  const P = flow.params, p = patient(flow.pid);
  $('#bStart').hidden = true; $('#bTare').disabled = true; $('#bStop').hidden = false;
  const zb = ZONES[flow.zone].base; const sideF = flow.side==='L' ? (p._simL || (p._simL = .84 + Math.random()*.14)) : 1;
  const nAtt = flow.mode==='reps' ? P.reps : 1;
  for(let a=0; a<nAtt; a++){
    if(!live || live.stopped) return;
    if(nAtt>1) setStatus(`Intento ${a+1} de ${nAtt}`);
    await wait(600);
    autoZero();
    if(!(await countdown())) return;
    const dur = flow.mode==='fallo' ? P.maxDur : P.dur;
    live.tmax = flow.mode==='fallo' ? 15 : dur;
    live.rec = [];
    const peakSim = zb * sideF * (.93 + Math.random()*.14);
    Sensor.setEffort({dir:flow.dir, mode:flow.mode, peak:peakSim, hold:3 + Math.random()*5, decay:5 + Math.random()*4, target:live.target, endAt: flow.mode==='fallo' ? null : dur - .15});
    const t0 = performance.now();
    await new Promise(res => {
      const chk = () => { if(!live || live.stopped) return res();
        const t = (performance.now()-t0)/1000, r = live.rec;
        if(flow.mode==='fallo'){ const pk = Math.max(0,...r); const tail = r.slice(-Math.max(2,Math.round(curHz()*.3))); const tailMax = Math.max(...tail);
          if(t > 1.5 && pk > 20 && tailMax < P.failPct/100*pk) return res();
          setStatus('¡Sostené! '+t.toFixed(1)+' s'); }
        else setStatus('¡Fuerza! '+Math.max(0, dur - t).toFixed(1)+' s');
        if(t >= dur) return res();
        live.timeout = setTimeout(chk, 50); };
      chk(); });
    if(!live || live.stopped) return;
    Sensor.setEffort(null); beep(520,300);
    live.attempts.push(live.rec.slice()); live.rec = null; live.tmax = null;
    if(a < nAtt-1){ await rest(P.rest); }
  }
  finishTest();
}
function rest(sec){ return new Promise(res => { let left = sec; $('#bSkip').hidden = false; live.skip = () => { clearInterval(live.restTimer); $('#bSkip').hidden = true; res(); };
  setStatus('Descanso '+left+' s'); live.restTimer = setInterval(()=>{ left--; if(left<=3 && left>0) beep(660,80); setStatus('Descanso '+left+' s'); if(left<=0){ live.skip(); } }, 1000); }); }
function finishTest(){
  const P = flow.params, p = patient(flow.pid);
  const opts = {failPct:P.failPct, target:live.target};
  const hz = curHz();
  const all = live.attempts.map(s => ({samples:s, m:metrics(s, hz, opts)}));
  let best = all.reduce((a,b)=> b.m.peak > a.m.peak ? b : a, all[0]);
  let m = Object.assign({}, best.m);
  if(flow.mode==='reps' && P.keep==='promedio'){ ['peak','mean','rfd100','rfd200','impulse','tPeak'].forEach(k=> m[k] = all.reduce((s,x)=>s+(x.m[k]||0),0)/all.length); }
  flow.result = {id:uid(), patientId:p.id, date:new Date().toISOString(), zone:flow.zone, exercise:flow.exercise, side:flow.side, mode:flow.mode, params:Object.assign({},P), target:live.target, samples:best.samples.map(v=>Math.round(v*10)/10), attempts:all.map(x=>({peak:x.m.peak, rfd100:x.m.rfd100})), metrics:m, source:Sensor.kind, hz, dir:flow.dir};
  stopLive(); go('evalResultado');
}

/* ----- resultado / ver evaluación ----- */
function resultBody(e, saved){
  const p = patient(e.patientId); const m = e.metrics; const u = unitLbl();
  const other = e.side==='B' ? null : DB.evals.filter(x=>x.patientId===e.patientId && x.exercise===e.exercise && x.side!==e.side && x.side!=='B' && x.id!==e.id && sameDay(x.date, e.date)).sort((a,b)=>b.metrics.peak-a.metrics.peak)[0];
  const sideCol = s => s==='L' ? '#3FA7FF' : s==='R' ? '#FFD21F' : '#F4F5F6';
  afterRenderHooks.push(()=> drawCurves($('#resC'), [...(other?[{data:other.samples, color:sideCol(other.side), alpha:.9, hz:other.hz||HZ}]:[]), {data:e.samples, color:sideCol(e.side), hz:e.hz||HZ}], {target:e.target, h:280}));
  let asym = '';
  if(other){ const a = e.metrics.peak, b = other.metrics.peak, mx = Math.max(a,b), pct = (mx-Math.min(a,b))/mx*100; const L = e.side==='L'?a:b, R = e.side==='R'?a:b;
    asym = `<div class="card" style="margin-top:12px"><h3>Izquierdo vs derecho (hoy)</h3><div class="asym"><span class="light" style="background:${asymColor(pct)};width:28px;height:28px"></span><div><div class="big" style="font-size:40px">${pct.toFixed(1)} %</div><div class="muted">${asymText(pct)} · ${L<R?'izquierdo':'derecho'} más débil · Izq ${fF(L)} / Der ${fF(R)} ${u}</div></div></div></div>`; }
  const M = (k,v,sub) => `<div class="metric"><div class="k">${k}</div><div class="v">${v}</div>${sub?`<div class="k">${sub}</div>`:''}</div>`;
  return `
  <div class="row" style="margin-bottom:8px"><h1 style="margin:0">${esc(e.exercise)}</h1><span class="chip ${e.side}">${SIDE_NAME[e.side]}</span>${e.source==='sim'?'<span class="chip">Simulado</span>':''}<span class="chip">${e.dir==='E'?'Empuje':'Tracción'}</span><span class="chip">${Math.round(e.hz||HZ)} Hz</span></div>
  <p class="muted" style="margin-top:0">${esc(p.name)} · ${fDT(e.date)} · ${MODES[e.mode].name}</p>
  <div class="card"><canvas id="resC" role="img" aria-label="Curva fuerza-tiempo"></canvas>
    <div class="legend" style="margin-top:8px">${other?`<span class="${other.side==='L'?'lL':'lR'}">${SIDE_NAME[other.side]}</span>`:''}<span class="${e.side==='L'?'lL':'lR'}">${SIDE_NAME[e.side]}</span>${e.target?'<span class="lT">Objetivo</span>':''}</div></div>
  ${asym}
  <div class="grid g4" style="margin-top:12px">
    ${M('Pico', fF(m.peak)+' '+u, p.weight?(m.peak/p.weight).toFixed(1)+' N/kg':null)}
    ${M('Fuerza media', fF(m.mean)+' '+u)}
    ${M('Tiempo al pico', m.tPeak.toFixed(2)+' s')}
    ${M('RFD 0–100 ms', fF(m.rfd100)+' '+u+'/s')}
    ${M('RFD 0–200 ms', fF(m.rfd200)+' '+u+'/s')}
    ${M('Impulso', fF(m.impulse,1)+' '+u+'·s')}
    ${e.mode==='fallo'?M('Tiempo sostenido', m.tFail!=null?m.tFail.toFixed(1)+' s':m.dur.toFixed(1)+' s', 'hasta caer al '+e.params.failPct+' %'):''}
    ${e.mode==='fallo'?M('Caída final', m.drop.toFixed(0)+' %'):''}
    ${e.mode==='objetivo'?M('Dentro del objetivo', (m.inBand||0).toFixed(0)+' %', 'del tiempo (±5 %)'):''}
  </div>
  ${e.attempts && e.attempts.length>1?`<div class="card" style="margin-top:12px"><h3>Intentos</h3><table><thead><tr><th>#</th><th>Pico (${u})</th><th>RFD 0–100 (${u}/s)</th></tr></thead><tbody>${e.attempts.map((a,i)=>`<tr><td>${i+1}</td><td>${fF(a.peak)}</td><td>${fF(a.rfd100)}</td></tr>`).join('')}</tbody></table><p class="muted small">Guardado: ${e.params.keep==='promedio'?'promedio de intentos':'mejor intento'}.</p></div>`:''}`;
}
VIEWS.evalResultado = () => {
  const e = flow.result; const other = e.side==='L'?'R':e.side==='R'?'L':null;
  return `${resultBody(e,false)}
  <div class="row noprint" style="margin-top:16px">
    <button class="btn primary big" data-action="saveEval">Guardar</button>
    <button class="btn" data-action="repeat">Repetir</button>
    <button class="btn danger" data-action="discard">Descartar</button>
  </div>
  ${other?`<p class="muted small">Después de guardar te ofrezco evaluar el lado ${SIDE_NAME[other].toLowerCase()}.</p>`:''}`;
};
VIEWS.evalSaved = () => {
  const e = DB.evals.find(x=>x.id===view.id); const p = patient(e.patientId);
  const otherSide = e.side==='L'?'R':e.side==='R'?'L':null;
  const missing = otherSide && !todaySides(p.id, e.exercise)[otherSide];
  return `<div class="note" style="margin-bottom:12px;background:#15261C;border-color:#1F5A36;color:#C9F5D9">Evaluación guardada.</div>
  ${resultBody(e,true)}
  <div class="row noprint" style="margin-top:16px">
    ${missing?`<button class="btn primary big" data-action="otherSide" data-side="${otherSide}">Evaluar lado ${SIDE_NAME[otherSide].toLowerCase()}</button>`:''}
    <button class="btn ${missing?'':'primary big'}" data-action="openPatient" data-id="${p.id}">Volver al paciente</button>
    <button class="btn" data-action="newEval" data-id="${p.id}">Otro ejercicio</button>
  </div>`;
};
VIEWS.evalVer = () => {
  const e = DB.evals.find(x=>x.id===view.id); if(!e) return VIEWS.pacientes();
  return `<button class="back" data-action="openPatient" data-id="${e.patientId}">← ${esc(patient(e.patientId).name)}</button>

  <div class="row noprint" style="margin-top:16px"><button class="btn" data-action="evalCsv" data-id="${e.id}">Curva en CSV</button><div class="spacer"></div><button class="btn danger" data-action="delEval" data-id="${e.id}">Eliminar evaluación</button></div>`;
};

  afterRenderHooks.push(()=> $('#sf').addEventListener('submit', e=>{ e.preventDefault(); const fd = Object.fromEntries(new FormData(e.target).entries()); s.unit = fd.unit; s.asymGreen = parseFloat(fd.g)||10; s.asymRed = parseFloat(fd.r)||15; s.countdown = parseInt(fd.cd)||0; save(); toast('Ajustes guardados'); go('pacientes'); }));

      <div class="field"><label for="s-u">Unidad de fuerza</label><select id="s-u" name="unit"><option value="N" ${s.unit==='N'?'selected':''}>Newtons (N)</option><option value="kgf" ${s.unit==='kgf'?'selected':''}>Kilogramos fuerza (kgf)</option></select></div>
      <div class="field"><label for="s-cd">Cuenta regresiva (s)</label><input id="s-cd" name="cd" type="number" min="0" max="10" value="${s.countdown}"></div>

  </form>
  <div class="card" style="margin-top:12px"><h3>Datos</h3><p class="muted small">Los pacientes y evaluaciones se guardan en este navegador, en este dispositivo.</p>
    <div class="row"><button class="btn" data-action="backup">Copia de seguridad (JSON)</button><button class="btn" data-action="restore">Restaurar copia</button></div></div>`;

/* ---------------- modal / export ---------------- */
function openModal(html){ $('#modalRoot').innerHTML = `<div class="modal-bg" data-action="closeModalBg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f = $('#modalRoot').querySelector('button,textarea,input'); if(f) f.focus(); }
function closeModal(){ $('#modalRoot').innerHTML = ''; }
function exportModal(title, text, filename){
  openModal(`<h2>${esc(title)}</h2><textarea id="expTxt" rows="10" readonly style="font-family:ui-monospace,monospace;font-size:12px">${esc(text)}</textarea>
  <div class="row" style="margin-top:12px"><button class="btn primary" data-action="copyExp">Copiar</button><button class="btn" data-action="dlExp" data-fn="${esc(filename)}">Descargar</button><div class="spacer"></div><button class="btn ghost" data-action="closeModal">Cerrar</button></div>
  <p class="muted small">Si la descarga no arranca en esta vista previa, usá Copiar y pegalo en Excel o Sheets.</p>`);
}
function csvPatient(pid){
  const p = patient(pid); const head = ['paciente','fecha','zona','ejercicio','lado','sentido','modo','pico_N','pico_N_kg','media_N','tiempo_pico_s','rfd100_N_s','rfd200_N_s','impulso_Ns','tiempo_sostenido_s','dentro_objetivo_pct','fuente'];
  const rows = evalsOf(pid).map(e=>[p.name, e.date, ZONES[e.zone]?.name, e.exercise, SIDE_NAME[e.side], e.dir==='E'?'Empuje':'Tracción', MODES[e.mode].name, e.metrics.peak.toFixed(1), p.weight?(e.metrics.peak/p.weight).toFixed(2):'', e.metrics.mean.toFixed(1), e.metrics.tPeak.toFixed(3), e.metrics.rfd100.toFixed(0), e.metrics.rfd200.toFixed(0), e.metrics.impulse.toFixed(1), e.metrics.tFail!=null?e.metrics.tFail.toFixed(2):'', e.metrics.inBand!=null?e.metrics.inBand.toFixed(0):'', e.source]);
  return [head, ...rows].map(r=>r.map(c=>/[",;\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\n');
}
function reportModal(pid){
  const p = patient(pid); const ev = evalsOf(pid); const exs = [...new Set(ev.map(e=>e.exercise))];
  const rows = exs.map(x => { const es = ev.filter(e=>e.exercise===x); const pr = asymPairs(es)[0]; const bL = Math.max(0,...es.filter(e=>e.side==='L').map(e=>e.metrics.peak)), bR = Math.max(0,...es.filter(e=>e.side==='R').map(e=>e.metrics.peak));
    return `<tr><td>${esc(x)}</td><td>${bL?fF(bL):'—'}</td><td>${bR?fF(bR):'—'}</td><td>${pr?`<span class="asym"><span class="light" style="background:${asymColor(pr.a)}"></span>${pr.a.toFixed(1)} % (${fDate(pr.date)})</span>`:'—'}</td></tr>`; }).join('');
  openModal(`<h2>Informe · ${esc(p.name)}</h2><p class="muted small">${esc([p.sport,p.position,p.weight?p.weight+' kg':null].filter(Boolean).join(' · '))} · ${fDate(new Date().toISOString())}</p>
  <table><thead><tr><th>Ejercicio</th><th>Mejor izq (${unitLbl()})</th><th>Mejor der (${unitLbl()})</th><th>Última asimetría</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="row" style="margin-top:14px"><button class="btn primary" data-action="print">Imprimir / PDF</button><div class="spacer"></div><button class="btn ghost" data-action="closeModal">Cerrar</button></div>
  <p class="muted small">En la versión publicada (GitHub Pages) este botón genera el PDF. En esta vista previa la impresión puede estar bloqueada.</p>`);
}
function demoPatient(){
  const id = uid(); DB.patients.push({id, name:'Juan Pérez (ejemplo)', sport:'Rugby', position:'Ala · M20', weight:92, dominant:'Derecho', birth:'2006-05-12', notes:'Ejemplo: desgarro isquios izquierdo. Retorno progresivo.', created:new Date().toISOString()});
  const ex = 'Isquios 90°';
  [[42,.78],[28,.84],[14,.9],[3,.95]].forEach(([d,f]) => ['L','R'].forEach(side => {
    const date = new Date(Date.now()-d*864e5 + (side==='R'?600000:0)).toISOString(); const pk = 400*(side==='L'?f:1)*(.97+Math.random()*.06);
    const s = []; for(let i=0;i<HZ*5;i++){ s.push(Math.round(simForce({mode:'tiempo', peak:pk, endAt:4.85}, i/HZ)*10)/10); }
    DB.evals.push({id:uid(), patientId:id, date, zone:'rodilla', exercise:ex, side, mode:'tiempo', params:{dur:5}, samples:s, attempts:[], metrics:metrics(s), source:'sim'}); }));
  save(); go('paciente', {id});
}

/* ---------------- acciones ---------------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-action]'); if(!el) return;
  const a = el.dataset.action, id = el.dataset.id;
  if(a === 'closeModalBg'){ if(ev.target === el) closeModal(); return; }
  switch(a){
    case 'home': go('pacientes'); break;
    case 'settings': go('ajustes'); break;
    case 'sensor':
      openModal(`<h2>Sensor</h2><p>Estado: <b>${Sensor.kind==='ble'?'Sensor TrakForce conectado':Sensor.kind==='sim'?'Modo simulado':'Sin sensor'}</b></p>
      <div class="row"><button class="btn primary" data-action="bleConnect">Conectar sensor Bluetooth</button><button class="btn" data-action="simMode">Usar modo simulado</button></div>
      <div class="metric" style="margin-top:12px"><div class="k">Lectura en vivo (con signo)</div><div class="v" id="modalLive">—</div><div class="k" id="modalHz"></div></div><p class="muted small" style="margin-top:12px">El sensor aparece como <b>TrakForce</b>. En iPhone/iPad se usa desde la app Bluefy.</p><div class="row"><div class="spacer"></div><button class="btn ghost" data-action="closeModal">Cerrar</button></div>`); break;
    case 'bleConnect': closeModal(); await Sensor.connectBLE(); break;
    case 'simMode': closeModal(); Sensor.startSim(); toast('Modo simulado'); break;
    case 'closeModal': closeModal(); break;
    case 'newPatient': go('pacienteForm', {id:null}); break;
    case 'editPatient': go('pacienteForm', {id}); break;
    case 'openPatient': go('paciente', {id}); break;
    case 'demo': demoPatient(); break;
    case 'delPatient': openModal(`<h2>¿Eliminar paciente?</h2><p>Se borran también todas sus evaluaciones. No se puede deshacer.</p><div class="row"><button class="btn danger" data-action="delPatientOk" data-id="${id}">Eliminar</button><button class="btn" data-action="closeModal">Cancelar</button></div>`); break;
    case 'delPatientOk': DB.patients = DB.patients.filter(p=>p.id!==id); DB.evals = DB.evals.filter(e=>e.patientId!==id); save(); closeModal(); go('pacientes'); break;
    case 'newEval': flow = {pid:id}; go('evalZona'); break;
    case 'zone': pickZone(el.dataset.zone); break;
    case 'backZona': go('evalZona'); break;
    case 'exercise': flow.exercise = el.dataset.ex; flow.side = null; flow.dir = null; go('evalConfig'); break;
    case 'backEj': go('evalEjercicio'); break;
    case 'side': flow.side = el.dataset.side; render(); break;
    case 'mode': flow.mode = el.dataset.mode; render(); break;
    case 'dir': flow.dir = el.dataset.dir; render(); break;
    case 'toTest': if(flow.mode==='objetivo' && !flow.params.ref && !bestPeak(flow.pid, flow.exercise, flow.side)){ toast('Cargá un máximo de referencia para el modo objetivo'); return; } go('evalTest'); break;
    case 'cancelTest': go('evalConfig'); break;
    case 'tare': if(live){ autoZero(); } else Sensor.tare(); toast('Tara hecha'); break;
    case 'startTest': if(Sensor.kind==='off'){ toast('No hay sensor: conectalo o elegí modo simulado.'); return; } runTest(); break;
    case 'stopTest':
      if(live && live.rec && live.rec.length > curHz()){ live.attempts.push(live.rec.slice()); live.rec = null; Sensor.setEffort(null); finishTest(); }
      else if(live && live.attempts.length){ Sensor.setEffort(null); finishTest(); }
      else go('evalConfig');
      break;
    case 'skipRest': if(live && live.skip) live.skip(); break;
    case 'saveEval': DB.evals.push(flow.result); DB.settings.exDir = DB.settings.exDir||{}; DB.settings.exDir[flow.result.exercise] = flow.result.dir; save(); go('evalSaved', {id:flow.result.id}); break;
    case 'repeat': go('evalTest'); break;
    case 'discard': go('evalConfig'); break;
    case 'otherSide': flow.side = el.dataset.side; go('evalTest'); break;
    case 'openEval': go('evalVer', {id}); break;
    case 'delEval': openModal(`<h2>¿Eliminar evaluación?</h2><p>No se puede deshacer.</p><div class="row"><button class="btn danger" data-action="delEvalOk" data-id="${id}">Eliminar</button><button class="btn" data-action="closeModal">Cancelar</button></div>`); break;
    case 'delEvalOk': { const e = DB.evals.find(x=>x.id===id); DB.evals = DB.evals.filter(x=>x.id!==id); save(); closeModal(); go('paciente', {id:e.patientId}); break; }
    case 'csv': exportModal('Exportar CSV', csvPatient(id), 'trakforce_'+patient(id).name.replace(/\W+/g,'_')+'.csv'); break;
    case 'evalCsv': { const e = DB.evals.find(x=>x.id===id); exportModal('Curva fuerza-tiempo', 't_s,fuerza_N\n'+e.samples.map((v,i)=>(i/(e.hz||HZ)).toFixed(4)+','+v).join('\n'), 'curva_'+e.exercise.replace(/\W+/g,'_')+'_'+e.side+'.csv'); break; }
    case 'report': reportModal(id); break;
    case 'print': try{ window.print(); }catch(e){ toast('La impresión está bloqueada en esta vista previa.'); } break;
    case 'copyExp': try{ await navigator.clipboard.writeText($('#expTxt').value); toast('Copiado'); }catch(e){ $('#expTxt').select(); toast('Seleccioná y copiá manualmente'); } break;
    case 'dlExp': try{ const b = new Blob([$('#expTxt').value], {type:'text/plain'}); const u = URL.createObjectURL(b); const l = document.createElement('a'); l.href = u; l.download = el.dataset.fn; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u), 1000); }catch(e){ toast('Descarga bloqueada: usá Copiar.'); } break;
    case 'backup': exportModal('Copia de seguridad', JSON.stringify(DB), 'trakforce_backup.json'); break;
    case 'restore': openModal(`<h2>Restaurar copia</h2><p class="muted small">Pegá el contenido de una copia de seguridad. Reemplaza todos los datos actuales.</p><textarea id="rTxt" rows="8"></textarea><div class="row" style="margin-top:12px"><button class="btn primary" data-action="restoreOk">Restaurar</button><button class="btn" data-action="closeModal">Cancelar</button></div>`); break;
    case 'restoreOk': try{ const d = JSON.parse($('#rTxt').value); if(!Array.isArray(d.patients)) throw 0; DB = d; save(); closeModal(); go('pacientes'); toast('Datos restaurados'); }catch(e){ toast('El texto no es una copia válida'); } break;
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('#modalRoot').innerHTML) closeModal(); });
window.addEventListener('resize', () => { if(['paciente','evalVer','evalResultado','evalSaved'].includes(view.name)) render(); });

setInterval(()=>{ const m=document.getElementById('modalLive'); if(!m) return; const n=Sensor.last.length; if(!n){ m.textContent='sin datos'; return; } const v=Sensor.last[n-1]-Sensor.offset; m.textContent=fF(v)+' '+unitLbl(); const h=document.getElementById('modalHz'); if(h) h.textContent=(Sensor.kind==='ble'?'Sensor':'Simulado')+' · '+Math.round(Sensor.rate||0)+' Hz'; }, 150);
Sensor.startSim();
render();
</script>
</body>
</html>
